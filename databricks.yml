# Databricks Asset Bundle: despliega el pipeline como un job mensual en serverless.
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run bank_health_monthly -t dev
bundle:
  name: peru-bank-health

variables:
  catalog:
    default: workspace
  schema:
    default: bank_health

resources:
  jobs:
    bank_health_monthly:
      name: "Peru bank health - pipeline mensual"
      schedule:
        # El BCRP publica los indicadores bancarios con ~1 mes de rezago: corre el día 20 a las 8:00 (Lima)
        quartz_cron_expression: "0 0 8 20 * ?"
        timezone_id: "America/Lima"
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - requests
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
        - task_key: bronze
          depends_on: [{task_key: setup}]
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ./notebooks/02_silver_transform.py
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./notebooks/03_gold_kpis.py
        - task_key: early_warning
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ./notebooks/04_early_warning.py
        - task_key: drift
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ./notebooks/05_drift_monitoring.py

targets:
  dev:
    mode: development
    default: true
